[workspace]
resolver = "2"
members = ["crates/i18n", "crates/core", "crates/app"]
default-members = ["crates/i18n", "crates/core"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/otherwisetech/mosaico-rs"

[workspace.dependencies]
mosaico-core = { path = "crates/core" }
i18n = { path = "crates/i18n", package = "mosaico-i18n" }
anyhow = "1"
# deep links, app discovery and the shared entity registry of Otherwise apps
otherwise-link = { git = "https://github.com/otherwisetech/otherwise-link", tag = "v0.2.0" }
# GPUI stack, same as rama, diskmap and genealogy-rs. Git deps move: Cargo.lock pins revs.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

[profile.dev]
opt-level = 1
# GPUI with debuginfo is ~10 GB of target/; keep it lean
debug = 0
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
