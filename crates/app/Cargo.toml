[package]
name = "mosaico-app"
description = "Organize your photos by date, on your own disk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mosaico"
path = "src/main.rs"

[dependencies]
i18n.workspace = true
mosaico-core.workspace = true
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# GitHub star count (one GET a day)
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
otherwise-link.workspace = true
uuid = "1"
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true

[dev-dependencies]
tempfile = "3"

# build.rs embeds the .exe icon; only pulled in when building on Windows
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
